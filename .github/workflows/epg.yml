name: Atualizar EPG
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  # Executa código de terceiros (iptv-org/epg): job isolado, sem permissões nem segredos. Se falhar, o build segue sem o mi.tv.
  mitv:
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Baixar guia mi.tv (iptv-org/epg)
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git iptv-epg
          cd iptv-epg
          npm install --ignore-scripts --no-audit --no-fund
          mkdir -p ../mitv
          npm run grab --silent -- --channels=sites/mi.tv/mi.tv_br.channels.xml --days=4 --maxConnections=8 --timeout=20000 --output=../mitv/guide.xml
      - uses: actions/upload-artifact@v4
        with:
          name: mitv
          path: mitv/guide.xml
          retention-days: 1
  build:
    needs: mitv
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.build.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: mitv
          path: mitv
      - name: Gerar EPG
        id: build
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USER: ${{ secrets.XTREAM_USER }}
          XTREAM_PASS: ${{ secrets.XTREAM_PASS }}
          M3U4U_EPG_URL: ${{ secrets.M3U4U_EPG_URL }}
        run: python scripts/build_epg.py
      - uses: actions/upload-pages-artifact@v3
        if: steps.build.outputs.publish == 'true'
        with:
          path: docs
      # Avisos: abre/atualiza/fecha issues (label epg-alerta). O GitHub envia e-mail ao abrir.
      - name: Avisos por issue
        if: always()
        uses: actions/github-script@v7
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const LABEL = 'epg-alerta';
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            let alerts = [], completo = false;
            try {
              const j = JSON.parse(fs.readFileSync('alerts/alerts.json', 'utf8'));
              alerts = j.alertas || []; completo = !!j.completo;
            } catch (e) {
              if (process.env.BUILD_OUTCOME === 'failure') {
                alerts = [{ key: 'script-falhou', title: 'Falha ao gerar o EPG',
                  body: 'O passo "Gerar EPG" terminou com erro inesperado. O EPG anterior continua publicado.', repeat: true }];
              }
            }
            await github.rest.issues.createLabel({ owner, repo, name: LABEL, color: 'd93f0b',
              description: 'Avisos automáticos do EPG' }).catch(() => {});
            const open = await github.paginate(github.rest.issues.listForRepo,
              { owner, repo, state: 'open', labels: LABEL, per_page: 100 });
            const byKey = new Map();
            for (const i of open) {
              const m = (i.body || '').match(/<!-- key:(.+?) -->/);
              if (m) byKey.set(m[1], i);
            }
            for (const a of alerts) {
              const title = `[EPG] ${a.title}`;
              const head = `<!-- key:${a.key} -->\n${a.body}`;
              const body = `${head}\n\n_Aviso automático · [execução](${run})_`;
              const ex = byKey.get(a.key);
              if (!ex) {
                await github.rest.issues.create({ owner, repo, title, body, labels: [LABEL] });
              } else {
                if (ex.title !== title || !(ex.body || '').startsWith(head)) {
                  await github.rest.issues.update({ owner, repo, issue_number: ex.number, title, body });
                }
                if (a.repeat) {
                  await github.rest.issues.createComment({ owner, repo, issue_number: ex.number,
                    body: `Ainda ocorrendo na execução ${run}` });
                }
              }
            }
            if (completo) {
              for (const [key, i] of byKey) {
                if (!alerts.some(a => a.key === key)) {
                  await github.rest.issues.createComment({ owner, repo, issue_number: i.number,
                    body: `Resolvido automaticamente na execução ${run}.` });
                  await github.rest.issues.update({ owner, repo, issue_number: i.number, state: 'closed' });
                }
              }
            }
  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
