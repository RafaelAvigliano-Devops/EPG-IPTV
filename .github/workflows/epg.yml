name: Atualizar EPG
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Gerar EPG
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USER: ${{ secrets.XTREAM_USER }}
          XTREAM_PASS: ${{ secrets.XTREAM_PASS }}
          M3U4U_EPG_URL: ${{ secrets.M3U4U_EPG_URL }}
        run: python scripts/build_epg.py
      - name: Commit
        run: |
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "EPG $(date -u +%F\ %H:%M)"
          git push
